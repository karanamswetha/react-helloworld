steps:
  # Step 1: Install dependencies
  - name: 'node:18'
    entrypoint: 'npm'
    args: ['install']

  # Step 2: Build the React app
  - name: 'node:18'
    entrypoint: 'npm'
    args: ['run', 'build']

  # Step 3: Deploy to different Google Cloud Storage buckets based on branch
  - name: 'gcr.io/cloud-builders/gsutil'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        if [[ "$BRANCH_NAME" == "main" ]]; then
          gsutil -m cp -r build/* gs://caitcustomerappdevelop/
        elif [[ "$BRANCH_NAME" == "develop" ]]; then
          gsutil -m cp -r build/* gs://caitcustomerappuat/
        fi
options:
  logging: CLOUD_LOGGING_ONLY
