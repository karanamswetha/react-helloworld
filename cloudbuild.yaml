substitutions:
  _REGION: us-central1

steps:
  # Step 1: Install dependencies
  - name: 'node:18'
    entrypoint: 'npm'
    args: ['install']

  # Step 2: Build the React app
  - name: 'node:18'
    entrypoint: 'npm'
    args: ['run', 'build']

  # Step 3: Copy build artifacts to output directory for Cloud Deploy
  - name: 'gcr.io/cloud-builders/gsutil'
    entrypoint: 'bash'
    args:
      - -c
      - |
        mkdir -p deploy-output
        cp -r build/* deploy-output/

  # Step 4: Trigger Cloud Deploy release
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - -c
      - |
        if [[ "$BRANCH_NAME" == "develop" ]]; then
          TARGET="dev"
        elif [[ "$BRANCH_NAME" == "release" ]]; then
          TARGET="uat"
        else
          echo "No deployment target configured for this branch: $BRANCH_NAME"
          exit 0
        fi

        gcloud deploy releases create release-$SHORT_SHA \
          --delivery-pipeline=customerapp-pipeline \
          --region=$_REGION \
          --source=. \
          --to-target=$TARGET \
          --labels=branch=$BRANCH_NAME

artifacts:
  files:
    - deploy-output/**
