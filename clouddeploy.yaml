apiVersion: deploy.cloud.google.com/v1
kind: DeliveryPipeline
metadata:
  name: customerapp-pipeline
description: "Pipeline for Customer React App"

serialPipeline:
  stages:
    - targetId: dev
      profiles: [dev]
    - targetId: uat
      profiles: [uat]
      approvalRequired: true
---
apiVersion: deploy.cloud.google.com/v1
kind: Target
metadata:
  name: dev
description: "Development environment"
gcs:
  location: gs://caitcustomerappdevelop

---
apiVersion: deploy.cloud.google.com/v1
kind: Target
metadata:
  name: uat
description: "UAT/Release environment"
gcs:
  location: gs://caitcustomerappuat
